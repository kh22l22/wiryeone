<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>위례 ONE 시연 사진</title>
<style>
  /* 노트북 화면에 예시 사진을 띄우고 휴대폰 앱으로 다시 찍는 시연용 화면.
     검은 배경에 사진만 크게 두어, 앱의 '화면' 후보가 사진 속 물건보다 노트북 화면 테두리를 잡지 않게 한다. */
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #f5f5f7; font-family: system-ui, "Malgun Gothic", sans-serif; }
  body { display: grid; grid-template-rows: 1fr auto; overflow: hidden; }
  .stage { position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .stage img { max-width: 100%; max-height: 100%; object-fit: contain; user-select: none; }
  .nav { position: absolute; top: 0; bottom: 0; width: 30%; border: 0; background: transparent; cursor: pointer; }
  .nav:focus-visible { outline: 2px solid #2997ff; }
  .prev { left: 0; } .next { right: 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 8px 16px; font-size: 14px; color: #a1a1a6; }
  .bar strong { color: #f5f5f7; font-weight: 600; }
  .groups { display: flex; flex-wrap: wrap; gap: 6px; }
  .groups button { padding: 4px 10px; border: 1px solid #424245; border-radius: 999px; background: transparent; color: #d2d2d7; font: inherit; font-size: 13px; cursor: pointer; }
  .groups button[aria-pressed="true"] { border-color: #f5f5f7; color: #fff; }
  .empty { padding: 32px; text-align: center; }
  body.clean .bar { display: none; }
</style>
</head>
<body>
<main class="stage" aria-live="polite">
  <img id="photo" alt="">
  <button class="nav prev" type="button" aria-label="이전 사진"></button>
  <button class="nav next" type="button" aria-label="다음 사진"></button>
</main>
<footer class="bar">
  <span><strong id="caption"></strong> <span id="count"></span> · AI로 만든 시연용 이미지, 들어 있는 정보는 모두 가짜</span>
  <span class="groups" id="groups"></span>
  <span>← → 넘기기 · F 전체 화면 · H 안내 숨기기</span>
</footer>
<script>
  const img = document.getElementById('photo');
  const caption = document.getElementById('caption');
  const count = document.getElementById('count');
  const groupsEl = document.getElementById('groups');
  let list = [];
  let i = 0;

  function show(n) {
    if (!list.length) return;
    i = (n + list.length) % list.length;
    const s = list[i];
    img.src = `samples/${s.file}`;
    img.alt = `${s.group ?? ''} 예시: ${s.label}`;
    caption.textContent = `${s.group ? `${s.group} · ` : ''}${s.label}`;
    count.textContent = `${i + 1} / ${list.length}`;
    for (const b of groupsEl.children) b.setAttribute('aria-pressed', String(b.dataset.group === s.group));
    if (list[i + 1]) new Image().src = `samples/${list[i + 1].file}`; // 다음 사진을 미리 받아 넘길 때 깜박이지 않게 한다.
  }

  document.querySelector('.prev').addEventListener('click', () => show(i - 1));
  document.querySelector('.next').addEventListener('click', () => show(i + 1));
  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') show(i + 1);
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') show(i - 1);
    else if (e.key === 'f' || e.key === 'F') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    else if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('clean');
    else if (/^[1-9]$/.test(e.key)) groupsEl.children[Number(e.key) - 1]?.click();
  });

  fetch('samples/manifest.json')
    .then((r) => r.json())
    .then((data) => {
      list = (Array.isArray(data) ? data : data.samples ?? []).filter((s) => typeof s.file === 'string' && !/^[a-z]+:|^\/|\.\./i.test(s.file));
      const groups = [...new Set(list.map((s) => s.group).filter(Boolean))];
      groups.forEach((g, k) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.dataset.group = g;
        b.textContent = `${k + 1} ${g}`;
        b.addEventListener('click', () => show(list.findIndex((s) => s.group === g)));
        groupsEl.append(b);
      });
      const start = Number(new URLSearchParams(location.search).get('n'));
      show(Number.isInteger(start) && start > 0 ? start - 1 : 0);
    })
    .catch(() => { document.querySelector('.stage').innerHTML = '<p class="empty">예시 사진 목록을 불러오지 못했습니다.</p>'; });
</script>
</body>
</html>
